# Runs the whole platform together: PostgreSQL + Spring Boot backend + React frontend.
#
#   Run from THIS (backend) folder:   docker compose up --build
#   Then open:  http://localhost:5173   (backend API at http://localhost:8080)
#
# The frontend now lives in the ./frontend subfolder of this repo.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge_gap_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Loads OAuth (Google/GitHub), mail, JWT and other secrets from .env into the
    # container. Without this the app only gets the DB vars below and sends Google
    # the placeholder client-id -> "OAuth client was not found".
    env_file:
      - .env
    environment:
      # These override anything in .env so the app points at the 'db' service
      # (inside Docker the database host is 'db', not localhost).
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/knowledge_gap_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
