# ── Development profile (uses H2 in-memory DB so no PostgreSQL needed) ──
spring:
  datasource:
    url: jdbc:h2:mem:knowledgegapdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        jdbc:
          use_get_generated_keys: true
  h2:
    console:
      enabled: true
      path: /h2-console

  # Disable real mail in dev
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
